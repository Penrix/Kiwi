name: Penrix Kiwi ARM64 standalone build (requires Linux self-hosted runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-chromium-build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap full Chromium 105
        run: bash penrix/build/bootstrap_chromium_105.sh "$RUNNER_TEMP/penrix-chromium-105-$GITHUB_RUN_ID"
      - name: Build arm64 APK
        run: bash penrix/build/build_android9.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/penrix-chromium-105-$GITHUB_RUN_ID/src"
