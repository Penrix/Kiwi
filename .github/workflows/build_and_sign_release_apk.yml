# Original fork workflow required private STORAGE_HOST / STORAGE_KEY caches.
# It cannot build/sign releases independently on Penrix.
name: Legacy private-cache Kiwi release disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Original Kiwi private cache and signing secrets unavailable; see penrix/BUILD.md"
          exit 1
